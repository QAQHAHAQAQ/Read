<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
:root{
  --bg:#0c0f13; --panel:#151a21; --line:#242c37;
  --txt:#e9eff6; --muted:#78859a; --accent:#f0b429;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:radial-gradient(1200px 520px at 50% -200px,#1c2330 0%,#0c0f13 62%);
  color:var(--txt);
  font-family:"Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
  font-size:14.5px;overflow:hidden;user-select:none;
  box-shadow:inset 0 0 0 1px #1e2731;
}
.app{display:flex;flex-direction:column;height:100vh;}

header, .titlebar{display:flex;align-items:center;gap:9px;padding:0 10px 0 16px;height:44px;flex:none;
  border-bottom:1px solid rgba(255,255,255,.035);}
.brand{font-size:13.5px;font-weight:600;letter-spacing:.5px;display:flex;align-items:center;gap:9px;}
.logo{width:9px;height:9px;border-radius:50%;background:#c99a24;transition:.3s;flex:none;}
.logo.on{background:#ffcb52;box-shadow:0 0 10px rgba(255,203,82,.9);}
.logo.pause{background:#697b90;box-shadow:0 0 7px rgba(120,145,175,.45);}
.spacer{flex:1;}
.tbtn{
  background:transparent;border:1px solid var(--line);color:var(--muted);
  padding:6px 12px;border-radius:7px;font-size:12.5px;cursor:pointer;
  font-family:inherit;transition:.18s;
}
.tbtn:hover{color:var(--txt);border-color:#34404f;background:#1a212a;}
.winbtns{display:flex;gap:2px;margin-left:6px;}
.wb{
  width:32px;height:26px;border:none;background:transparent;color:#6b7889;
  font-size:15px;line-height:1;cursor:pointer;border-radius:6px;font-family:inherit;
  transition:.15s;
}
.wb:hover{background:#1c232c;color:#dbe4ee;}
.wb.close:hover{background:#c0392b;color:#fff;}

main{flex:1;overflow-y:auto;padding:6px 16px 28px;scroll-behavior:smooth;}
main::-webkit-scrollbar{width:9px;}
main::-webkit-scrollbar-track{background:transparent;}
main::-webkit-scrollbar-thumb{background:#2b3542;border-radius:5px;
  border:2px solid transparent;background-clip:padding-box;}
main::-webkit-scrollbar-thumb:hover{background:#3b4859;background-clip:padding-box;}

#empty{
  height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;color:#4a5666;
}
#empty .big{font-size:40px;opacity:.3;line-height:1;}
#empty .tip{font-size:13px;letter-spacing:.3px;}

.seg{
  padding:9px 14px;margin:3px 0;border-radius:9px;font-size:14.5px;
  border-left:2px solid transparent;color:#a4b2c3;line-height:1.95;
  cursor:pointer;transition:background .25s,color .25s,border-color .25s;
}
.seg:hover{background:#141a21;color:#c8d4e2;}
.seg.done{color:#5e6b7c;}
.seg.cur{color:#f6fafd;background:rgba(240,180,41,.075);border-left-color:var(--accent);}

footer{position:relative;padding:0 20px 18px;}
footer::before{
  content:'';position:absolute;left:0;right:0;top:-34px;height:34px;
  background:linear-gradient(to top,#0c0f13 25%,rgba(12,15,19,0));
  pointer-events:none;
}
.progress{height:3px;background:#283442;border-radius:2px;overflow:hidden;margin-bottom:15px;}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ffd166);
     border-radius:2px;transition:width .35s ease;}

.controls{display:flex;align-items:center;gap:12px;}
.iconbtn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:#161c24;color:#9dabbb;cursor:pointer;font-size:13px;
  display:flex;align-items:center;justify-content:center;
  transition:.18s;font-family:inherit;
}
.iconbtn:hover{background:#1d2530;color:var(--txt);border-color:#33404f;}
.iconbtn:disabled{opacity:.32;cursor:default;}
.iconbtn:disabled:hover{background:#161c24;color:#9dabbb;border-color:var(--line);}

#play{
  width:54px;height:54px;border:none;border-radius:50%;
  background:linear-gradient(145deg,#ffcb52,#f0b429);color:#231a05;
  font-size:18px;cursor:pointer;box-shadow:0 6px 22px rgba(240,180,41,.26);
  transition:.2s;display:flex;align-items:center;justify-content:center;
}
#play:hover{transform:translateY(-1px);box-shadow:0 9px 28px rgba(240,180,41,.36);}
#play:active{transform:translateY(0) scale(.97);}

.meta{margin-left:auto;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;}

.settings{
  display:flex;align-items:center;gap:13px;margin-top:15px;padding-top:13px;
  border-top:1px solid #1a212a;color:var(--muted);font-size:12.5px;
}
.settings label{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none;}
input[type=range]{
  -webkit-appearance:none;width:86px;height:3px;border-radius:2px;
  background:#242c37;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px rgba(240,180,41,.14);
}
select{
  background:#161c24;color:#c2cedd;border:1px solid var(--line);border-radius:7px;
  padding:6px 8px;font-family:inherit;font-size:12px;outline:none;cursor:pointer;
  max-width:116px;
}
#rateval{width:40px;text-align:right;font-variant-numeric:tabular-nums;color:#a9b6c6;}
.hks{margin-left:auto;display:flex;gap:6px;flex:none;}
.hk{
  display:flex;align-items:center;gap:5px;background:#161c24;border:1px solid var(--line);
  border-radius:7px;padding:3px 6px 3px 7px;color:var(--muted);font-family:inherit;
  font-size:11px;cursor:pointer;transition:.15s;white-space:nowrap;
}
.hk:hover{border-color:#3a4757;color:#c3cfdd;}
.hk b{
  font-weight:500;background:#0e1319;border:1px solid #2a3441;border-radius:5px;
  padding:2px 5px;color:#cfa963;font-size:10.5px;font-variant-numeric:tabular-nums;
}
.hk.rec{border-color:#b8452f;color:#e08a78;}
.hk.rec b{color:#e9907f;border-color:#5a2b25;background:#241211;}
.hk.bad{border-color:#a35a2a;background:#1d1410;}
</style>
</head>
<body>
<div class="app">
  <div class="titlebar pywebview-drag-region">
    <div class="brand"><span class="logo" id="dot"></span>耳读</div>
    <div class="spacer"></div>
    <button class="tbtn" id="btnShot">截图朗读</button>
    <button class="tbtn" id="btnPaste">读剪贴板</button>
    <button class="tbtn" id="btnClear">清空</button>
    <div class="winbtns">
      <button class="wb" id="btnMin" title="最小化">–</button>
      <button class="wb close" id="btnClose" title="关闭">×</button>
    </div>
  </div>

  <main>
    <div id="empty">
      <div class="big">◍</div>
      <div class="tip">复制一段文字，点右上角「读剪贴板」</div>
    </div>
    <div id="text"></div>
  </main>

  <footer>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="controls">
      <button class="iconbtn" id="btnPrev" title="上一段">◀◀</button>
      <button id="play" title="播放 / 暂停">▶</button>
      <button class="iconbtn" id="btnNext" title="下一段">▶▶</button>
      <button class="iconbtn" id="btnStop" title="停止">■</button>
      <div class="meta" id="meta">就绪</div>
    </div>
    <div class="settings">
      <label>语速
        <input type="range" id="rate" min="-30" max="40" step="2" value="8">
        <span id="rateval">+8%</span>
      </label>
      <label>音色
        <select id="voice">
          <option value="zh-CN-XiaoxiaoNeural">晓晓 · 女 · 自然</option>
          <option value="zh-CN-YunxiNeural">云希 · 男 · 年轻</option>
          <option value="zh-CN-YunjianNeural">云健 · 男 · 浑厚</option>
          <option value="zh-CN-XiaoyiNeural">晓伊 · 女 · 温柔</option>
          <option value="zh-CN-YunyangNeural">云扬 · 男 · 播音</option>
        </select>
      </label>
      <div class="hks">
        <button class="hk" data-action="read"><span>剪贴板</span><b id="hkRead">—</b></button>
        <button class="hk" data-action="shot"><span>截图</span><b id="hkShot">—</b></button>
      </div>
    </div>
  </footer>
</div>

<script>
let segs = [], curIdx = -1, status = 'idle';
let lastRev = -1, lastCur = -2, lastStatus = 'none';
let lastNotice = '', noticeUntil = 0, noticeShown = false;
let recording = null;
const $ = id => document.getElementById(id);
window.onerror = function(m, s, l){
  try { document.getElementById('meta').textContent = 'ERR@' + l + ': ' + m; } catch(e){}
};

function renderSegments(list){
  segs = list || [];
  const box = $('text');
  $('empty').style.display = segs.length ? 'none' : 'flex';
  box.innerHTML = '';
  segs.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'seg';
    d.textContent = t;
    d.onclick = () => { if (window.pywebview) window.pywebview.api.play(i); };
    box.appendChild(d);
  });
}

function paint(){
  const nodes = $('text').children;
  for (let i = 0; i < nodes.length; i++){
    nodes[i].className = 'seg' + (i === curIdx ? ' cur' : (curIdx >= 0 && i < curIdx ? ' done' : ''));
  }
  if (nodes[curIdx]) nodes[curIdx].scrollIntoView({block:'center', behavior:'smooth'});

  const total = segs.length;
  $('bar').style.width = total && curIdx >= 0 ? ((curIdx + 1) / total * 100) + '%' : '0%';

  const dot = $('dot'), btn = $('play');
  dot.className = 'logo' + (status === 'playing' ? ' on' : (status === 'paused' ? ' pause' : ''));
  btn.textContent = (status === 'playing') ? '❚❚' : '▶';

  const idle = !total;
  $('btnPrev').disabled = idle;
  $('btnNext').disabled = idle;
  $('btnStop').disabled = idle || (status === 'idle' && curIdx < 0);

  const m = $('meta');
  if (!total) m.textContent = '就绪';
  else if (status === 'playing') m.textContent = `第 ${curIdx + 1} / ${total} 段`;
  else if (status === 'paused') m.textContent = `已暂停 · 第 ${curIdx + 1} / ${total} 段`;
  else m.textContent = `${total} 段 · ${segs.join('').length} 字`;
}

function stamp(msg){
  lastNotice = msg; noticeUntil = Date.now() + 3000; noticeShown = true;
  $('meta').textContent = msg;
}

async function poll(){
  if (!window.pywebview || !window.pywebview.api) return;
  try {
    const s = await window.pywebview.api.get_state();
    if (!s) return;
    if (s.rev !== lastRev){
      lastRev = s.rev;
      const d = await window.pywebview.api.get_segs();
      renderSegments(d.segs);
      lastCur = -2; lastStatus = 'none';
    }
    if (s.status !== lastStatus || s.cur !== lastCur){
      lastStatus = s.status; lastCur = s.cur;
      curIdx = s.cur; status = s.status;
      paint();
    }
    if (s.notice && s.notice !== lastNotice){
      lastNotice = s.notice; noticeUntil = Date.now() + 2800; noticeShown = true;
    }
    if (Date.now() < noticeUntil){ $('meta').textContent = lastNotice; noticeShown = true; }
    else if (noticeShown){ noticeShown = false; paint(); }
    // 热键还没读到就隔一会儿重试（页面可能比热键注册先加载）
    if ($('hkRead').textContent === '—' && (++hkRetry % 12 === 0)) loadSettings();
  } catch(e){}
}
setInterval(poll, 260);

async function loadSettings(){
  try {
    const d = await window.pywebview.api.get_settings();
    if (!d) return;
    const r = d.readable || {};
    if (r.read) $('hkRead').textContent = r.read;
    if (r.shot) $('hkShot').textContent = r.shot;
    const s = d.settings || {};
    if (s.rate !== undefined){
      $('rate').value = s.rate;
      $('rateval').textContent = (s.rate > 0 ? '+' : '') + s.rate + '%';
    }
    if (s.voice) $('voice').value = s.voice;
    // 注册失败的热键标出来，悬停能看原因
    const errs = d.errors || {};
    ['read','shot'].forEach(a => {
      const el = document.querySelector(`.hk[data-action="${a}"]`);
      if (!el) return;
      if (errs[a]) { el.classList.add('bad'); el.title = errs[a]; }
      else { el.classList.remove('bad'); el.title = ''; }
    });
  } catch(e){}
}
let hkRetry = 0;

// ── 热键录制 ──────────────────────────────────────────
document.querySelectorAll('.hk').forEach(el => {
  el.onclick = () => {
    if (recording) return;
    recording = el.dataset.action;
    el.classList.add('rec');
    el.querySelector('b').textContent = '按下组合或侧键…';
  };
});

async function submitHotkey(action, combo){
  const el = document.querySelector(`.hk[data-action="${action}"]`);
  const label = el.querySelector('b');
  const r = await window.pywebview.api.set_hotkey(action, combo);
  el.classList.remove('rec');
  recording = null;
  if (r && r.ok){
    label.textContent = r.readable;
    stamp(r.readable + ' 已生效');
  } else {
    if (r && r.readable) label.textContent = r.readable;
    el.classList.add('bad');
    setTimeout(() => el.classList.remove('bad'), 1400);
    stamp((r && r.msg) || '设置失败');
  }
}

$('btnPaste').onclick = async () => {
  const r = await window.pywebview.api.load_clip();
  if (r){ lastRev = r.rev; renderSegments(r.segs); lastCur = -2; lastStatus = 'none'; paint(); }
  if (r && !r.segs.length) stamp('剪贴板里没有可念的文字');
};
$('btnShot').onclick = () => { if (window.pywebview) window.pywebview.api.capture(); };
$('btnClear').onclick = async () => {
  await window.pywebview.api.stop();
  segs = []; curIdx = -1; status = 'idle';
  renderSegments([]); paint();
};
$('play').onclick = async () => {
  if (!segs.length){ $('btnPaste').click(); return; }
  if (status === 'playing') await window.pywebview.api.pause();
  else if (status === 'paused') await window.pywebview.api.resume();
  else await window.pywebview.api.play(curIdx < 0 ? 0 : curIdx);
};
$('btnStop').onclick = () => window.pywebview.api.stop();
$('btnMin').onclick = () => window.pywebview.api.minimize();
$('btnClose').onclick = () => window.pywebview.api.close();
$('btnPrev').onclick = () => window.pywebview.api.play(Math.max(0, curIdx - 1));
$('btnNext').onclick = () => window.pywebview.api.play(Math.min(segs.length - 1, curIdx + 1));

$('rate').oninput = e => {
  const v = parseInt(e.target.value);
  $('rateval').textContent = (v > 0 ? '+' : '') + v + '%';
};
$('rate').onchange = e => window.pywebview.api.set_rate(parseInt(e.target.value));
$('voice').onchange = e => window.pywebview.api.set_voice(e.target.value);

// 鼠标侧键（RegisterHotKey 不支持，靠低级钩子抓）
document.addEventListener('mousedown', e => {
  if (!recording) return;
  if (e.target.closest && e.target.closest('.hk')) return;   // 点按钮本身不算
  e.preventDefault();
  e.stopPropagation();
  const map = {3: 'mouse4', 4: 'mouse5'};
  const name = map[e.button];
  if (!name){
    stamp('鼠标只支持侧键（第四、第五键）');
    return;
  }
  submitHotkey(recording, name);
}, true);

document.addEventListener('keydown', e => {
  if (recording){
    e.preventDefault();
    e.stopPropagation();
    if (e.code === 'Escape'){
      const el = document.querySelector(`.hk[data-action="${recording}"]`);
      el.classList.remove('rec');
      loadSettings();
      recording = null;
      return;
    }
    const mods = [];
    if (e.ctrlKey) mods.push('ctrl');
    if (e.altKey) mods.push('alt');
    if (e.shiftKey) mods.push('shift');
    if (e.metaKey) mods.push('win');
    const k = (e.key || '').toLowerCase();
    if (['control','alt','shift','meta','os','contextmenu'].includes(k)) return;
    if (!mods.length){ stamp('至少要按住 Ctrl / Alt / Shift / Win 其中一个'); return; }
    let key = k;
    if (k === ' ') key = 'space';
    if (key.length > 1 && !/^f\d{1,2}$/.test(key)) {
      stamp('这个键暂不支持，换个字母、数字或 F 键');
      return;
    }
    submitHotkey(recording, mods.concat(key).join('+'));
    return;
  }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space'){ e.preventDefault(); $('play').click(); }
  if (e.code === 'Escape'){ e.preventDefault(); $('btnStop').click(); }
  if (e.code === 'ArrowRight'){ e.preventDefault(); $('btnNext').click(); }
  if (e.code === 'ArrowLeft'){ e.preventDefault(); $('btnPrev').click(); }
});

window.addEventListener('pywebviewready', () => { poll(); paint(); loadSettings(); });
</script>
</body>
</html>
